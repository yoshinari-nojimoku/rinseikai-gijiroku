<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊野林星会 定例会 議事録一覧</title>
<style>
  :root{--green:#2e6b35;--green-d:#1f4a25;--gold:#b8862b;--bg:#f6f4ee;--card:#fff;--ink:#222;--muted:#6b6b6b;--line:#e3ddd0;}
  *{box-sizing:border-box}
  body{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;color:var(--ink);background:var(--bg);margin:0;line-height:1.75;}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px;}
  header.doc{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;border-radius:14px;padding:26px 30px;box-shadow:0 6px 18px rgba(0,0,0,.12);}
  header.doc .eyebrow{font-size:13px;letter-spacing:.18em;opacity:.85;margin:0 0 6px}
  header.doc h1{margin:0;font-size:24px;letter-spacing:.02em}
  header.doc .sub{margin-top:6px;font-size:13.5px;opacity:.9}
  ul.list{list-style:none;padding:0;margin:20px 0 0}
  ul.list li{margin:0 0 12px}
  a.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;text-decoration:none;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.03);transition:.15s;}
  a.card:hover{border-color:var(--green);box-shadow:0 4px 12px rgba(46,107,53,.12);transform:translateY(-1px)}
  a.card .ym{background:var(--green);color:#fff;border-radius:10px;padding:8px 12px;font-weight:bold;font-size:15px;white-space:nowrap}
  a.card .ttl{font-size:16px;color:var(--green-d);font-weight:bold}
  a.card .arw{margin-left:auto;color:var(--gold);font-size:20px}
  footer.doc{margin-top:30px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
  footer.doc a{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
  <header class="doc">
    <p class="eyebrow">熊野林星会　定例会　議事録</p>
    <h1>議事録一覧</h1>
    <div class="sub">熊野材のファンを増やし、地域に貢献する ── 木育・製材・林業の連携活動</div>
  </header>

  <ul class="list">
    <li>
      <a class="card" href="2026-08.html">
        <span class="ym">2026.08</span>
        <span class="ttl">8月度 定例会 議事録（8/2開催）</span>
        <span class="arw">›</span>
      </a>
    </li>
    <li>
      <a class="card" href="2026-07.html">
        <span class="ym">2026.07</span>
        <span class="ttl">7月度 定例会 議事録（7/12開催）</span>
        <span class="arw">›</span>
      </a>
    </li>
    <li>
      <a class="card" href="2026-06.html">
        <span class="ym">2026.06</span>
        <span class="ttl">6月度 定例会 議事録（6/7開催）</span>
        <span class="arw">›</span>
      </a>
    </li>
  </ul>

  <footer class="doc">
    熊野林星会（三重県熊野市）｜公式サイト <a href="https://rinseikai.net/">rinseikai.net</a><br>
    ※このページは執行部の議事録共有用です。
  </footer>
</div>
</body>
</html>
